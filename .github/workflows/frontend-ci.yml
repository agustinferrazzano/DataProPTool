name: Frontend CI Pipeline

# SIEMPRE EJECUTA: Este pipeline se ejecuta en TODOS los push/PR a dev
# sin importar qué archivos cambien, garantizando validación completa
on:
  push:
    branches: [ dev , preproduccion]
  pull_request:
    branches: [ dev , preproduccion]

# Permisos globales para todo el workflow
permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write
  issues: write

env:
  NODE_VERSION: '20'

jobs:
  # ===============================================
  # JOB 1: TESTS Y VALIDACIÓN DEL FRONTEND
  # ===============================================
  frontend-tests:
    name: Frontend Tests & Quality
    runs-on: ubuntu-latest 
    defaults: 
      run:
        working-directory: ./frontend
    
    steps:
      # El checkout sirve para obtener el código del repositorio
    - name: 📥 Checkout código 
      uses: actions/checkout@v4

      # Configurar Node.js
    - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with: 
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: 📦 Instalar dependencias
      run: npm ci
    
      # Oxlint es una herramienta de linting para proyectos React
    - name: 🔍 Ejecutar oxlint (calidad de código)
      run: npm run lint
    # Verificamos tipos de TypeScript para asegurar que no hay errores de tipado
    - name: 🔧 Verificar tipos TypeScript
      run: |
        # Si tienes TypeScript configurado
        if [ -f "tsconfig.json" ]; then
          npx tsc --noEmit
        else
          echo "✅ No TypeScript config found, skipping type check"
        fi
    # Ejecutamos los tests unitarios para asegurar que todo funciona correctamente
    - name: 🧪 Ejecutar tests unitarios
      run: npm run test
    # Ejecutamos coverage para medir la cobertura de tests
    - name: 📊 Generar coverage report
      run: |
        if npm run test:coverage 2>/dev/null; then
          echo "✅ Coverage report generated"
        else
          echo "ℹ️ No coverage script found, skipping"
        fi
    # Construimos el proyecto para producción
    - name: 🏗️ Build del proyecto
      run: npm run build
      env:
        # Variables de entorno para el build
        VITE_API_URL: http://localhost:8000
    # Verificamos el tamaño del bundle para controlar el peso de la app
    - name: 🔍 Verificar tamaño del bundle
      run: |
        echo "📦 Bundle size analysis:"
        if [ -d "dist" ]; then
          echo "Individual files:"
          du -sh dist/* | sort -hr
          echo ""
          echo "Total bundle size:"
          du -sh dist
          echo ""
          echo "📊 Detailed analysis:"
          find dist -name "*.js" -o -name "*.css" | xargs ls -lh
        fi
    # Subimos los artifacts del build para referencia futura
    - name: 📤 Subir artifacts del build
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist-${{ github.sha }}
        path: frontend/dist
        retention-days: 7
    
    - name: 📈 Comentar resultados en PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = './frontend/dist';
          if (fs.existsSync(path)) {
            const stats = fs.statSync(path);
            const size = (stats.size / 1024 / 1024).toFixed(2);
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚀 Frontend Build Successful\n\n✅ Build completado exitosamente\n📦 Bundle size: ${size}MB\n🔗 Artifacts disponibles para descarga`
            });
          }

  # ===============================================
  # JOB 2: ANÁLISIS DE SEGURIDAD
  # ===============================================
  frontend-security:
    name: Security Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
    
    - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with: 
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: 📦 Instalar dependencias
      run: npm ci
    # npm audit sirve para detectar vulnerabilidades en las dependencias
    - name: 🛡️ Audit de seguridad npm
      run: |
        echo "🔍 Ejecutando npm audit..."
        npm audit --audit-level high
    
    - name: 📊 Análisis de dependencias
      run: |
        echo "📦 Dependencias principales:"
        npm list --depth=0 --prod
        echo ""
        echo "🔧 Dependencias de desarrollo:"
        npm list --depth=0 --dev

  # ===============================================
  # JOB 3: DEPLOY A GITHUB PAGES (STAGING)
  # ===============================================
  deploy-staging:
    name: 🚀 Deploy to GitHub Pages
    needs: [frontend-tests, frontend-security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    
    # Permisos necesarios para GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write
    
    # Entorno de staging
    environment:
      name: staging
      url: ${{ steps.deployment.outputs.page_url }}
    
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
    
    - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with: 
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: 📦 Instalar dependencias
      run: npm ci
    
    - name: 🏗️ Build para producción
      run: npm run build
      env:
        # Variables de entorno para staging
        VITE_API_URL: https://dataproptool-backend.onrender.com
        VITE_APP_ENV: staging
    
    - name: 📋 Configurar GitHub Pages
      uses: actions/configure-pages@v4
    
    - name: 📤 Subir artefactos a Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./frontend/dist
    
    - name: 🚀 Deploy a GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
    
    - name: 📢 Mostrar URL de staging
      run: |
        echo "🚀 ¡Deploy exitoso!"
        echo ""
        echo "🌐 URLs de la aplicación:"
        echo "📱 Frontend: ${{ steps.deployment.outputs.page_url }}"
        echo "� Backend API: https://dataproptool-backend.onrender.com"
        echo "❤️ Health Check: https://dataproptool-backend.onrender.com/api/health/"
        echo ""
        echo "📊 Resumen del deploy:"
        echo "  - Branch: dev"
        echo "  - Commit: ${{ github.sha }}"
        echo "  - Frontend: GitHub Pages (estático)"
        echo "  - Backend: Render.com (API + PostgreSQL)"
        echo ""
        echo "🔗 Enlaces:"
        echo "  - App: ${{ steps.deployment.outputs.page_url }}"
        echo "  - Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        
        # También crear un archivo con las URLs para referencia
        echo "Frontend: ${{ steps.deployment.outputs.page_url }}" > staging-url.txt
        echo "Backend: https://dataproptool-backend.onrender.com" >> staging-url.txt
    
    - name: 📤 Subir URL de staging como artifact
      uses: actions/upload-artifact@v4
      with:
        name: staging-url-${{ github.sha }}
        path: ./frontend/staging-url.txt
        retention-days: 30

