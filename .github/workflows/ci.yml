name: Full Stack CI Pipeline

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'

jobs:
  # ===============================================
  # JOB 1: TESTS Y VALIDACIÓN DEL FRONTEND
  # ===============================================
  frontend-tests:
    name: Frontend Tests & Quality
    runs-on: ubuntu-latest
    defaults: 
      run:
        working-directory: ./frontend
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
    
    - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with: 
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: 📦 Instalar dependencias
      run: npm ci
    
    - name: 🔍 Ejecutar oxlint (calidad de código)
      run: npm run lint
    
    - name: 🔧 Verificar tipos TypeScript
      run: |
        # Si tienes TypeScript configurado
        if [ -f "tsconfig.json" ]; then
          npx tsc --noEmit
        else
          echo "✅ No TypeScript config found, skipping type check"
        fi
    
    - name: 🧪 Ejecutar tests unitarios
      run: npm run test
    
    - name: 📊 Generar coverage report
      run: |
        if npm run test:coverage 2>/dev/null; then
          echo "✅ Coverage report generated"
        else
          echo "ℹ️ No coverage script found, skipping"
        fi
    
    - name: 🏗️ Build del proyecto
      run: npm run build
      env:
        # Variables de entorno para el build
        VITE_API_URL: http://localhost:8000
    
    - name: 🔍 Verificar tamaño del bundle
      run: |
        echo "📦 Bundle size analysis:"
        if [ -d "dist" ]; then
          echo "Individual files:"
          du -sh dist/* | sort -hr
          echo ""
          echo "Total bundle size:"
          du -sh dist
          echo ""
          echo "📊 Detailed analysis:"
          find dist -name "*.js" -o -name "*.css" | xargs ls -lh
        fi
    
    - name: 📤 Subir artifacts del build
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist-${{ github.sha }}
        path: frontend/dist
        retention-days: 7
    
    - name: 📈 Comentar resultados en PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = './frontend/dist';
          if (fs.existsSync(path)) {
            const stats = fs.statSync(path);
            const size = (stats.size / 1024 / 1024).toFixed(2);
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚀 Frontend Build Successful\n\n✅ Build completado exitosamente\n📦 Bundle size: ${size}MB\n🔗 Artifacts disponibles para descarga`
            });
          }

  # ===============================================
  # JOB 2: ANÁLISIS DE SEGURIDAD
  # ===============================================
  frontend-security:
    name: Security Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
    
    - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with: 
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: 📦 Instalar dependencias
      run: npm ci
    
    - name: 🛡️ Audit de seguridad npm
      run: |
        echo "🔍 Ejecutando npm audit..."
        npm audit --audit-level high
    
    - name: 📊 Análisis de dependencias
      run: |
        echo "📦 Dependencias principales:"
        npm list --depth=0 --prod
        echo ""
        echo "🔧 Dependencias de desarrollo:"
        npm list --depth=0 --dev

  # ===============================================
  # JOB 3: TESTS Y VALIDACIÓN DEL BACKEND
  # ===============================================
  backend-tests:
    name: Backend Tests & Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: test_dataproptool
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
    
    - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt
    
    - name: 📦 Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r ../requirements.txt
        pip install -r ../requirements-dev.txt
    
    - name: 🔍 Ejecutar flake8 (linting)
      run: |
        echo "🔍 Analizando código Python con flake8..."
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: 🎨 Verificar formato de código con black
      run: |
        echo "🎨 Verificando formato de código..."
        black --check --diff .
    
    - name: 📦 Verificar orden de imports con isort
      run: |
        echo "📦 Verificando orden de imports..."
        isort --check-only --diff .
    
    - name: 🛡️ Análisis de seguridad con bandit
      run: |
        echo "🛡️ Ejecutando análisis de seguridad..."
        bandit -r . -x */tests*,*/migrations* --skip B101,B601
    
    - name: 🗄️ Ejecutar migraciones
      run: |
        echo "🗄️ Aplicando migraciones de base de datos..."
        python manage.py migrate --settings=backend.test_settings
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_dataproptool
        DJANGO_SETTINGS_MODULE: backend.test_settings
    
    - name: 🧪 Ejecutar tests con pytest
      run: |
        echo "🧪 Ejecutando tests del backend..."
        pytest --verbose --tb=short --cov=. --cov-report=xml --cov-report=term-missing
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_dataproptool
        DJANGO_SETTINGS_MODULE: backend.test_settings
    
    - name: 📊 Subir coverage a Codecov
      if: success()
      uses: codecov/codecov-action@v4
      with:
        file: backend/coverage.xml
        flags: backend
        name: backend-coverage
        fail_ci_if_error: false
    
    - name: 🔍 Verificar configuración Django
      run: |
        echo "🔍 Verificando configuración de Django..."
        python manage.py check --settings=backend.test_settings
        python manage.py check --deploy --settings=backend.test_settings
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_dataproptool
        DJANGO_SETTINGS_MODULE: backend.test_settings

  # ===============================================
  # JOB 4: INTEGRACIÓN Y VALIDACIÓN COMPLETA
  # ===============================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [frontend-tests, backend-tests]
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: integration_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
    
    - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: 📦 Instalar dependencias backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
      working-directory: ./backend
    
    - name: 📦 Instalar dependencias frontend
      run: npm ci
      working-directory: ./frontend
    
    - name: 🚀 Iniciar servidor Django
      run: |
        python manage.py migrate --settings=backend.test_settings
        python manage.py runserver --settings=backend.test_settings &
        sleep 10
      working-directory: ./backend
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/integration_test
        DJANGO_SETTINGS_MODULE: backend.test_settings
    
    - name: 🔗 Verificar conectividad API
      run: |
        echo "🔗 Verificando conectividad con la API..."
        curl -f http://localhost:8000/api/ || echo "API no disponible"
        curl -f http://localhost:8000/admin/ || echo "Admin no disponible"
    
    - name: 🏗️ Build frontend con API real
      run: npm run build
      working-directory: ./frontend
      env:
        VITE_API_URL: http://localhost:8000
    
    - name: 📈 Comentar resultado completo en PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## 🎉 Pipeline Completo Exitoso\n\n✅ Frontend tests passed\n✅ Backend tests passed\n✅ Integration tests passed\n\n📦 Build artifacts disponibles\n🚀 Ready for deployment!`
          });

