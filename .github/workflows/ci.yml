name: Frontend CI Pipeline

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

env:
  NODE_VERSION: '20'

jobs:
  # ===============================================
  # JOB 1: TESTS Y VALIDACIÓN DEL FRONTEND
  # ===============================================
  frontend-tests:
    name: Frontend Tests & Quality
    runs-on: ubuntu-latest
    defaults: 
      run:
        working-directory: ./frontend
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
    
    - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with: 
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: 📦 Instalar dependencias
      run: npm ci
    
    - name: 🔍 Ejecutar oxlint (calidad de código)
      run: npm run lint
    
    - name: 🔧 Verificar tipos TypeScript
      run: |
        # Si tienes TypeScript configurado
        if [ -f "tsconfig.json" ]; then
          npx tsc --noEmit
        else
          echo "✅ No TypeScript config found, skipping type check"
        fi
    
    - name: 🧪 Ejecutar tests unitarios
      run: npm run test
    
    - name: 📊 Generar coverage report
      run: |
        if npm run test:coverage 2>/dev/null; then
          echo "✅ Coverage report generated"
        else
          echo "ℹ️ No coverage script found, skipping"
        fi
    
    - name: 🏗️ Build del proyecto
      run: npm run build
      env:
        # Variables de entorno para el build
        VITE_API_URL: http://localhost:8000
    
    - name: 🔍 Verificar tamaño del bundle
      run: |
        echo "📦 Bundle size analysis:"
        if [ -d "dist" ]; then
          echo "Individual files:"
          du -sh dist/* | sort -hr
          echo ""
          echo "Total bundle size:"
          du -sh dist
          echo ""
          echo "📊 Detailed analysis:"
          find dist -name "*.js" -o -name "*.css" | xargs ls -lh
        fi
    
    - name: 📤 Subir artifacts del build
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist-${{ github.sha }}
        path: frontend/dist
        retention-days: 7
    
    - name: 📈 Comentar resultados en PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = './frontend/dist';
          if (fs.existsSync(path)) {
            const stats = fs.statSync(path);
            const size = (stats.size / 1024 / 1024).toFixed(2);
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🚀 Frontend Build Successful\n\n✅ Build completado exitosamente\n📦 Bundle size: ${size}MB\n🔗 Artifacts disponibles para descarga`
            });
          }

  # ===============================================
  # JOB 2: ANÁLISIS DE SEGURIDAD
  # ===============================================
  frontend-security:
    name: Security Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
    
    - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with: 
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: 📦 Instalar dependencias
      run: npm ci
    
    - name: 🛡️ Audit de seguridad npm
      run: |
        echo "🔍 Ejecutando npm audit..."
        npm audit --audit-level high
    
    - name: 📊 Análisis de dependencias
      run: |
        echo "📦 Dependencias principales:"
        npm list --depth=0 --prod
        echo ""
        echo "🔧 Dependencias de desarrollo:"
        npm list --depth=0 --dev

  # ===============================================
  # JOB 3: DEPLOY A GITHUB PAGES (STAGING)
  # ===============================================
  deploy-staging:
    name: 🚀 Deploy to GitHub Pages
    needs: [frontend-tests, frontend-security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    
    # Permisos necesarios para GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write
    
    # Entorno de staging
    environment:
      name: staging
      url: ${{ steps.deployment.outputs.page_url }}
    
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
    
    - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with: 
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: 📦 Instalar dependencias
      run: npm ci
    
    - name: 🏗️ Build para producción
      run: npm run build
      env:
        # Variables de entorno para staging
        VITE_API_URL: https://dataproptool-api-staging.onrender.com
        VITE_APP_ENV: staging
    
    - name: 📋 Configurar GitHub Pages
      uses: actions/configure-pages@v4
    
    - name: 📤 Subir artefactos a Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./frontend/dist
    
    - name: 🚀 Deploy a GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
    
    - name: 📢 Comentar URL de staging
      uses: actions/github-script@v7
      with:
        script: |
          const deployUrl = '${{ steps.deployment.outputs.page_url }}';
          
          // Si es un push directo a dev, crear un issue comment
          if (context.eventName === 'push') {
            // Buscar el último commit para comentar
            const { data: commits } = await github.rest.repos.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              per_page: 1
            });
            
            if (commits.length > 0) {
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                body: `## 🚀 Staging Deployment Successful!\n\n✅ **Aplicación desplegada en staging**\n\n🔗 **URL de staging**: ${deployUrl}\n\n📊 **Detalles del deploy:**\n- Branch: \`${context.ref.replace('refs/heads/', '')}\`\n- Commit: \`${context.sha.substring(0, 7)}\`\n- Workflow: [Ver detalles](${context.payload.repository.html_url}/actions/runs/${context.runId})`
              });
            }
          }

