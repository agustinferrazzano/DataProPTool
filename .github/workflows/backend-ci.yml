name: Backend CI Pipeline

# ⚡ SIEMPRE EJECUTA: Este pipeline se ejecuta en TODOS los push/PR a dev
# sin importar qué archivos cambien, garantizando validación completa
on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

# Permisos necesarios
permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  PYTHON_VERSION: '3.12'

jobs:
  # ===============================================
  # JOB 1: TESTS Y VALIDACIÓN DEL BACKEND
  # ===============================================
  backend-tests:
    name: Backend Tests & Quality
    runs-on: ubuntu-latest
    
    # Base de datos de prueba
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: dataproptool_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    defaults:
      run:
        working-directory: ./backend
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
    
    - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: 📦 Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r ../requirements.txt
        pip install -r ../requirements-dev.txt
    
    - name: 🔍 Análisis básico de código
      run: |
        echo "� Verificando sintaxis Python..."
        python -m py_compile $(find . -name "*.py" -not -path "*/migrations/*" | head -10)
      continue-on-error: true
    
    - name: 🗄️ Aplicar migraciones Django
      run: |
        echo "🗄️ Aplicando migraciones Django..."
        # Aplicar migraciones básicas de Django + las del proyecto
        python manage.py migrate --run-syncdb
        echo "✅ Migraciones completadas"
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/dataproptool_test
        DJANGO_SETTINGS_MODULE: backend.test_settings
    
    - name: ⚙️ Verificar migraciones
      run: |
        echo "⚙️ Verificando migraciones..."
        python manage.py showmigrations --plan
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/dataproptool_test
        DJANGO_SETTINGS_MODULE: backend.test_settings
    
    - name: 🧪 Ejecutar tests con pytest
      run: |
        echo "🧪 Ejecutando tests..."
        pytest --verbose --cov=. --cov-report=xml --cov-report=term-missing
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/dataproptool_test
        DJANGO_SETTINGS_MODULE: backend.test_settings
    
    - name: 📊 Subir coverage a artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: backend-coverage-${{ github.sha }}
        path: backend/coverage.xml
        retention-days: 7
    
    - name: 🔍 Verificar configuración Django
      run: |
        echo "🔍 Verificando configuración Django..."
        python manage.py check
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/dataproptool_test
        DJANGO_SETTINGS_MODULE: backend.test_settings

  # ===============================================
  # JOB 2: ANÁLISIS DE DEPENDENCIAS
  # ===============================================
  backend-security:
    name: Security Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
    
    - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: 📦 Instalar dependencias básicas
      run: |
        python -m pip install --upgrade pip
        pip install safety pip-audit
    
    - name: 🛡️ Audit de seguridad con safety
      run: |
        echo "🛡️ Ejecutando safety check..."
        safety check -r requirements.txt
      continue-on-error: true
    
    - name: 🔍 Audit con pip-audit
      run: |
        echo "🔍 Ejecutando pip-audit..."
        pip-audit --requirement requirements.txt --format=text
      continue-on-error: true
    
    - name: 📊 Análisis de dependencias
      run: |
        echo "📦 Dependencias principales:"
        cat requirements.txt
        echo ""
        echo "🔧 Dependencias de desarrollo:"
        cat requirements-dev.txt