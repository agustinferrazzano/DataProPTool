<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>DataProPTool - Redirecting...</title>
    <script type="text/javascript">
      // Redirect handler for GitHub Pages SPA
      // This script takes the current path and redirects to the index.html
      // with the path as a query parameter, which will be handled by the React Router
      
      var pathSegmentsToKeep = 1; // DataProPTool
      
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <div style="font-family: Arial, sans-serif; text-align: center; padding: 50px;">
      <h2>🔄 Redirecting...</h2>
      <p>Redirecting to DataProPTool application...</p>
    </div>
  </body>
</html>
