services:
  - type: web
    name: dataproptool-backend
    runtime: python3
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: echo "🚀 Starting with render.yaml - Using wsgi:application" && gunicorn wsgi:application --log-level debug
    plan: free
    envVars:
      - key: DJANGO_SETTINGS_MODULE  
        value: backend.production_settings
      - key: PYTHONPATH
        value: .:./backend
      - key: GUNICORN_CMD_ARGS
        value: --log-level debug --access-logfile - --error-logfile -
      - key: DATABASE_URL
        fromDatabase:
          name: dataproptool-db
          property: connectionString

databases:
  - name: dataproptool-db
    databaseName: dataproptool
    user: dataproptool
    plan: free