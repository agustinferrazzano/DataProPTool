services:
  - type: web
    name: dataproptool-backend
    runtime: python3
    repo: https://github.com/Sh1zukku/DataProPTool
    branch: dev
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn wsgi:application --log-level debug
    plan: free
    envVars:
      - key: DJANGO_SETTINGS_MODULE  
        value: backend.production_settings
      - key: PYTHONPATH
        value: .:./backend
      - key: GUNICORN_CMD_ARGS
        value: --log-level debug --access-logfile - --error-logfile -
