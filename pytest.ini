# pytest configuration for Django
[pytest]
DJANGO_SETTINGS_MODULE = backend.test_settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts = --verbose --tb=short --strict-markers --strict-config --cov=. --cov-report=term-missing --cov-report=xml --cov-fail-under=70

# Coverage configuration
[coverage:run]
source = .
omit = 
    */migrations/*
    */venv/*
    */env/*
    manage.py
    */settings/*
    */test_*.py
    */__pycache__/*
    */node_modules/*
    */static/*
    */media/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.: