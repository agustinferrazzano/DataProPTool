# pytest configuration for Django
[pytest]
DJANGO_SETTINGS_MODULE = backend.test_settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts = --verbose --tb=short --strict-markers --strict-config --cov=. --cov-config=.coveragerc --cov-report=term-missing --cov-report=xml --cov-fail-under=65